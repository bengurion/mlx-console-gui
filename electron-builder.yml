# Unsigned dev builds of the desktop app. Signing/notarization is a later,
# deliberate step — see the README's Gatekeeper note for running these.
appId: dev.mlx-console.app
productName: MLX Console GUI
directories:
  output: release
# vsce reads "main" as dist/extension.js; the app's entry is set here instead
# so one package.json serves both packagers.
extraMetadata:
  main: dist/electron/main.cjs
# The asar holds only what Electron itself loads. Everything Python spawns or
# the daemon serves off disk ships as plain files under Contents/Resources —
# python cannot exec a script that lives inside an asar archive.
asar: true
files:
  - dist/electron/**
  - package.json
extraResources:
  - from: dist/webview
    to: dist/webview
  - from: dist/cli.js
    to: dist/cli.js
  - from: resources/py
    to: resources/py
mac:
  category: public.app-category.developer-tools
  # Unsigned dev builds. To ship signed + notarized (Gatekeeper-clean):
  #   1. Join the Apple Developer Program; create a "Developer ID Application"
  #      certificate in Xcode → Settings → Accounts and it lands in your
  #      keychain.
  #   2. Delete the `identity: null` line below — electron-builder finds the
  #      certificate on its own.
  #   3. Uncomment the four lines after it.
  #   4. Export APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD (appleid.apple.com →
  #      App-Specific Passwords) and APPLE_TEAM_ID, then run
  #      `npm run app:package` — it signs, notarizes and staples in one go.
  identity: null
  # hardenedRuntime: true
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist
  # notarize: true
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
npmRebuild: false
